<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom)) 14px;
    color: #222;
  }
  header { text-align: center; color: #fff; margin-bottom: 14px; }
  header h1 { font-size: 21px; margin-bottom: 5px; }
  header p { opacity: 0.85; font-size: 12px; }

  .view-switcher {
    margin: 0 auto 12px; display: flex; gap: 6px;
    overflow-x: auto; background: rgba(255,255,255,0.12);
    padding: 6px; border-radius: 12px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; max-width: 1100px;
  }
  .view-switcher::-webkit-scrollbar { display: none; }
  .view-btn {
    padding: 10px 14px; border: 2px solid transparent; border-radius: 8px;
    background: rgba(255,255,255,0.15); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .view-btn.active { background: #ffd93d; color: #1e3c72; border-color: #fff; }

  .controls {
    max-width: 1100px; margin: 0 auto 12px;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .controls input, .controls button {
    padding: 10px 14px; border: none; border-radius: 8px; font-size: 14px;
  }
  .controls input { flex: 1; min-width: 180px; background: #fff; }
  .controls button { background: #ffd93d; color: #222; font-weight: 600; cursor: pointer; }

  .stats { text-align: center; color: #fff; font-size: 12px; opacity: 0.85; margin-bottom: 12px; }
  .content { max-width: 1100px; margin: 0 auto; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
  .card { perspective: 1200px; height: 320px; cursor: pointer; }
  .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 14px; padding: 16px 18px;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25); overflow-y: auto;
  }
  .card-front { background: #fff; border-left: 5px solid #2a5298; }
  .card-back { background: #fffbe6; border-left: 5px solid #ffd93d; transform: rotateY(180deg); }
  .card-num { font-size: 10px; font-weight: 700; color: #2a5298; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .card-back .card-num { color: #b8860b; }
  .card-front h3 { font-size: 15px; line-height: 1.35; color: #1e3c72; }
  .card-back .answer { font-size: 12.5px; line-height: 1.5; color: #333; white-space: pre-wrap; }
  .card-back .answer strong { color: #b8860b; }
  .hint { margin-top: auto; font-size: 10px; color: #888; text-align: right; font-style: italic; }

  .lecture { background: #fff; border-radius: 14px; padding: 20px 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .lecture h2 { color: #1e3c72; font-size: 18px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 3px solid #ffd93d; }
  .lecture-item { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px dashed #ccc; }
  .lecture-item:last-child { border-bottom: none; }
  .lecture-q { font-size: 15px; font-weight: 700; color: #1e3c72; margin-bottom: 8px; line-height: 1.4; }
  .lecture-q::before { content: attr(data-num) ". "; color: #b8860b; font-weight: 900; }
  .lecture-a { font-size: 13.5px; line-height: 1.6; color: #333; white-space: pre-wrap; padding-left: 14px; border-left: 3px solid #ffd93d; }
  .lecture-a strong { color: #b8860b; }

  .cheatsheet { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .cheatsheet h2 { color: #1e3c72; font-size: 18px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 3px solid #ffd93d; }
  .cheat-item { margin-bottom: 8px; padding: 10px 12px; border-radius: 8px; background: #f8f9fb; border-left: 4px solid #2a5298; }
  .cheat-q { font-weight: 700; color: #1e3c72; font-size: 13px; margin-bottom: 4px; }
  .cheat-a { font-size: 12px; line-height: 1.5; color: #444; white-space: pre-wrap; }
  .cheat-a strong { color: #b8860b; }

  .mcquiz { background: #fff; border-radius: 14px; padding: 22px 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); min-height: 400px; display: flex; flex-direction: column; }
  .mc-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; color: #666; }
  .mc-score { background: #e8f5e9; color: #2e7d32; padding: 4px 10px; border-radius: 12px; font-weight: 700; }
  .mc-score.bad { background: #ffebee; color: #c62828; }
  .mc-score.mid { background: #fff3e0; color: #ef6c00; }
  .mc-progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .mc-progress-fill { height: 100%; background: linear-gradient(90deg, #2a5298, #ffd93d); transition: width 0.3s; }
  .mc-question { font-size: 16.5px; font-weight: 700; color: #1e3c72; line-height: 1.4; margin-bottom: 16px; }
  .mc-options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 16px; }
  .mc-option { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #f5f7fa; border: 2px solid transparent; cursor: pointer; transition: 0.15s; font-size: 14px; line-height: 1.4; color: #333; text-align: left; }
  .mc-option:not(.disabled):active { transform: scale(0.99); background: #eef1f6; }
  .mc-option .letter { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: #2a5298; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .mc-option.correct { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; }
  .mc-option.correct .letter { background: #4caf50; }
  .mc-option.wrong { background: #ffebee; border-color: #e53935; color: #b71c1c; }
  .mc-option.wrong .letter { background: #e53935; }
  .mc-option.disabled { cursor: default; }
  .mc-explanation { font-size: 13px; line-height: 1.55; color: #333; white-space: pre-wrap; padding: 12px 14px; background: #fffbe6; border-left: 4px solid #ffd93d; border-radius: 8px; margin-bottom: 14px; }
  .mc-explanation strong { color: #b8860b; }
  .mc-explanation .ok { color: #2e7d32; font-weight: 700; }
  .mc-explanation .no { color: #c62828; font-weight: 700; }
  .mc-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  .mc-actions button { padding: 12px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; min-width: 100px; }
  .btn-next { background: #2a5298; color: #fff; }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-prev { background: #eee; color: #333; }
  .btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-restart { background: #ffd93d; color: #1e3c72; }
  .mc-finished { text-align: center; padding: 30px 20px; }
  .mc-finished h2 { color: #1e3c72; font-size: 22px; margin-bottom: 14px; }
  .mc-final-score { font-size: 48px; font-weight: 900; background: linear-gradient(135deg, #2a5298, #ffd93d); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
  .mc-final-text { font-size: 15px; color: #555; margin-bottom: 20px; }
  .mc-final-text.good { color: #2e7d32; font-weight: 700; }
  .mc-final-text.bad { color: #c62828; font-weight: 700; }
  .no-results { text-align: center; color: #fff; padding: 40px; font-size: 15px; opacity: 0.7; }

  @media (max-width: 600px) {
    .card { height: 340px; }
    header h1 { font-size: 19px; }
    .view-btn { padding: 9px 12px; font-size: 12px; }
    .lecture, .mcquiz { padding: 16px; }
    .mc-question { font-size: 15px; }
    .mc-option { font-size: 13.5px; padding: 11px 12px; }
  }
</style>
</head>

<script>
/* ============================================================
   56 КАРТОЧЕК — СТРОГО ПО ВОПРОСАМ ИЗ ДОКУМЕНТОВ
   ============================================================ */
const cards = [
  // КР №1: Вопросы 1-20
  { q: "Огнеупорные и теплоизоляционные материалы. Определения", a: "<strong>Огнеупорные материалы</strong> — неметаллические материалы, способные выдерживать воздействие высоких (выше +1580 °C) температур.\n\n<strong>Теплоизоляционные материалы</strong> — материалы, применяемые для защиты от нежелательного теплообмена с окружающей средой зданий, промышленных тепловых установок, или их узлов, холодильных камер, трубопроводов и т.п." },
  { q: "Каким требованиям должны отвечать огнеупоры", a: "1. Высокая огнеупорность (выше 1580 °C).\n2. Не разрушаясь выдерживать колебания температуры.\n3. Значительная механическая прочность при 1100 °C.\n4. Химическая стойкость к компонентам технологического процесса.\n5. Постоянство форм и объёма при нагреве и охлаждении.\n6. Определённые физические свойства (плотность, пористость, термомеханические, теплофизические, электрофизические)." },
  { q: "Классификация огнеупоров", a: "<strong>По химико-минералогическому составу:</strong> кремнезёмистые, алюмосиликатные, глинозёмистые, высокомагнезиальные, магнезиальносиликатные, магнезиальношпинелидные, глинозёмоизвестковые, известковые, хромистые, цирконистые, углеродистые, оксидоуглеродистые.\n\n<strong>По огнеупорности:</strong> огнеупорные (1580–1770 °C), высокоогнеупорные (1770–2000 °C), высшей огнеупорности (свыше 2000 °C).\n\n<strong>По пористости:</strong> от особо плотных (до 3%) до ультрапористых (свыше 75%).\n\n<strong>По способу укладки:</strong> бетонные, безобжиговые, обожжённые, горячепрессованные, затвердевшие из расплава." },
  { q: "Для чего используются огнеупоры и теплоизоляционные материалы в алюминиевых электролизерах", a: "1. Экономия тепловой энергии — уменьшение теплопотерь.\n2. Поддержание желательного теплового баланса.\n3. Увеличение срока службы ванн.\n4. Уменьшение риска несчастных случаев.\n5. Защита стального кожуха от воздействий высоких температур.\n\n<strong>Материалы:</strong> вермикулитовые плиты, шамотный кирпич ШБ-1, мертель МШ-36, угольные подовые блоки, подовая масса." },
  { q: "Агломерация. Определения", a: "<strong>Агломерация</strong> – один из методов окускования – превращения мелких руд и концентратов в кусковый материал – агломерат, применение которого улучшает ход металлургических процессов. В шихте доменных печей доля агломерата составляет 40–90 %.\n\n<strong>Агломерат</strong> производят методом спекания железорудной шихты на ленточных машинах непрерывного действия – агломашинах." },
  { q: "Сырьё для производства агломерата", a: "1. Железные руды (агломерационная руда фракции <10 мм).\n2. Железорудный концентрат (<0,1 мм).\n3. Оборотный возврат агломерата (<5 мм).\n4. Добавки: окалина, колошниковая пыль, шламы.\n5. Флюсы: известняк и доломит (для офлюсованного агломерата).\n6. Твёрдое топливо: коксовая мелочь." },
  { q: "Этапы технологического процесса спекания шихты в агломерат", a: "1. Зажигание под зажигательным горном верхнего слоя уложенной шихты.\n2. Спекание аглошихты в пористый пирог в зоне горения твердого топлива.\n3. Охлаждение готового агломерата просасываемым воздухом." },
  { q: "Основные требования к качеству агломерата", a: "1. Прочность на удар и истирание.\n2. Минимальное количество фракции менее 5 мм.\n3. Стабильность гранулометрического состава.\n4. Стабильность химического состава, в том числе по содержанию FeO." },
  { q: "Чугун. Определение, примерный химический состав", a: "<strong>ЧУГУН</strong> – железоуглеродистый сплав, в котором содержание углерода составляет от 2,14 до 6,67 %. Температура плавления 1150–1500 °C в зависимости от содержания углерода.\n\nВ чугун добавляют легирующие элементы: Ni, Cr, Al, Ti, W и т.д.\n\n<strong>Примерный состав:</strong> Si – 0,80 %; Mn – 0,40 %; S – 0,6 %; Ti – 0,10 %; P – 0,08 %; Cr – 0,05 %; C – 4,64 %." },
  { q: "Какие разновидности чугуна вы знаете?", a: "<strong>Белый</strong> — прочный, хрупкий, для переплавки в сталь.\n<strong>Серый</strong> — пластичный, вязкий, P 0,3–1,2 %.\n<strong>Легированный</strong> — стойкий к коррозии, твёрдый.\n<strong>Половинчатый</strong> — износостойкий, станкостроение.\n<strong>Высокопрочный</strong> — Mg, Ca.\n<strong>Ковкий</strong> — из белого чугуна, вязкий.\n<strong>Специальный</strong> — Si, Mn, антикоррозионный.\n\n<strong>Маркировка:</strong> СЧ — серый, ВЧ — высокопрочный, КЧ — ковкий." },
  { q: "Основное сырьё для производства чугуна", a: "1. Железные руды: железистые кварциты (65,5 %), титаномагнетитовые (17,3 %), магнетитовые (15,3 %).\n2. Агломерат — Fe 53–58 %.\n3. Окатыши — Fe 61,3–65,5 %, прочность 88–95 %.\n4. ГБЖ — Fe ≥ 90 %, металлизация ≥ 92 %.\n5. Коксующиеся угли и металлургический кокс." },
  { q: "Схема современного двухстадийного производства стали из руд", a: "<strong>I стадия — Получение чугуна из руд:</strong>\nДобыча руды и угля → Производство агломерата (руда + флюсы) → Производство кокса (коксующиеся угли) → Доменная печь (агломерат + руда + флюсы + кокс) → Чугун.\n\n<strong>II стадия — Передел чугуна в сталь:</strong>\nЧугун → Кислородный конвертер (или электропечь / агрегат ковш-печь) → Стальной полупродукт → Вакууматор → МНЛЗ → Литейно-прокатный агрегат → Плоский прокат." },
  { q: "Что представляет собой кокс, состав, использование", a: "Кокс представляет собой спекшуюся углеродную массу, содержание углерода 82–89 %, зольность 10–12 %.\n\nКокс является основным восстановительным агентом, опорным материалом и фильтрующей матрицей в доменной печи, применяется в производстве ферросплавов, литейном производстве, производстве электродов в цветной металлургии, химической промышленности." },
  { q: "Традиционный способ производства кокса, температурный режим и длительность процесса", a: "Кокс получают в процессе пиролиза угля — нагрев без доступа воздуха. Температура дымовых газов в отопительных простенках 1150–1350 °C, что обеспечивает непрямой нагрев угля до 1000–1100 °C.\n\nВ течение 14–24 ч получают кокс, процесс называется коксованием (карбонизацией).\n\nТрадиционный способ в камерных печах, объединённых в коксовые батареи, остаётся единственным." },
  { q: "Требования к сырью при производстве кокса", a: "Для производства кокса пригодны только некоторые типы углей, обладающие необходимыми пластическими свойствами.\n\nНаилучшими являются коксующиеся угли с выходом летучих веществ в пределах 18–27 %.\n\nДля коксования применяют угли марок: коксовые (К), жирные (Ж), отоценные спекающиеся (ОС) и газовые (Г)." },
  { q: "Процесс производства кокса, назовите 7 технологических операций", a: "1. Загрузка камер коксования угольной шихтой.\n2. Нагрев угольной шихты без доступа воздуха до заданных температур.\n3. Отвод и охлаждение прямого коксового газа из камер коксования.\n4. Выдача готового кокса из печей.\n5. Тушение кокса.\n6. Сортировка кокса на фракции.\n7. Транспортировка коксовой продукции в доменный цех или отгрузка потребителям." },
  { q: "Доменная печь, что это такое, принцип работы", a: "Доменная печь представляет собой печь шахтного типа, предназначенную для получения чугуна из железосодержащей шихты и кокса.\n\nПо принципу работы — это противоточный реактор. Движущей силой является горячее дутьё, сжигающее кокс перед воздушными фурмами, образуя фурменный газ. Столб шихты состоит из чередующихся слоёв кокса и железорудных материалов, загружаемых через верх (колошник)." },
  { q: "Назовите основные части доменной печи, для чего они служат", a: "— <strong>колошник</strong> — загрузочное устройство распределяет сырьё по окружности и радиусу;\n— <strong>шахта</strong> — нагрев шихтовых материалов и начало восстановления оксидов металлов;\n— <strong>распар и заплечики</strong> — заканчивается восстановление оксидов железа и образуются жидкие продукты плавки, стекающие в горн;\n— <strong>горн</strong> (металлоприёмник) — разделение чугуна и шлака по удельному весу, завершение восстановления.\n\nТакже: фурмы, чугунная лётка, шлаковая лётка, воздухонагреватели." },
  { q: "Технология доменной плавки, пять этапов", a: "1. Подача в воздушные фурмы горячего дутья (до 1250 °C и выше), которое сжигает перед фурмами кокс, обеспечивая температуру 1900–2300 °C.\n2. Горячий газ поднимается вверх, нагревает и расплавляет железорудные материалы, восстанавливает железо из оксидов.\n3. Образующиеся жидкие металл и шлак стекают по коксовой насадке в горн печи.\n4. Накопленные в горне чугун и шлак периодически удаляют через чугунную лётку.\n5. На место выгорающего кокса и опускающихся расплавов поступают новые порции рудного сырья и кокса." },
  { q: "Сущность доменного процесса (кратко)", a: "Восстановители: окись углерода (СО), водород (Н₂) и твердый углерод (С).\n\nРеакции:\nC + O₂ = CO₂\nCO₂ + C = 2CO\nH₂O + C = CO + H₂\n3Fe₂O₃ + CO = 2Fe₃O₄ + CO₂\nFe₃O₄ + CO = 3FeO + CO₂\nFeO + CO = Fe + CO₂\nFeO + C = Fe + CO (в горне)\n\n50–80 % оксидов железа восстанавливается газом, остальное — твёрдым углеродом." },

  // КР №3: Вопросы 21-40
  { q: "Классификация сталей по способу получения, по назначению", a: "<strong>По способу получения:</strong> мартеновские, конвертерные, электростали.\n\n<strong>По назначению:</strong> конструкционные, инструментальные, для ж/д транспорта (рельсовая, колёсная), подшипниковые, топочная сталь." },
  { q: "Классификация сталей по качеству, чем отличается высококачественная сталь", a: "По качеству: обыкновенного качества, качественные, высококачественные. Различия — в допустимом содержании вредных примесей (S, P) и неметаллических включений.\n\n<strong>Обыкновенного качества</strong> — Ст0–Ст6.\n<strong>Качественные</strong> — 08пс, 20, 45.\n<strong>Высококачественные</strong> — буква А в конце (30ХГСА).\n<strong>Особо высококачественные</strong> — Ш в конце.\n\nВысококачественная отличается минимальным содержанием серы и фосфора." },
  { q: "Основные легирующие элементы для конструкционных сталей, какие свойства придают хром, марганец и другие элементы", a: "<strong>Хром (Х)</strong> — жаропрочность, коррозионностойкость, кислотоупорность.\n<strong>Никель (Н)</strong> — то же, но сильнее; до 1000 °C.\n<strong>Марганец (Г)</strong> — предел текучести (пружины, рессоры), до 1,5 %.\n<strong>Кремний (С)</strong> — износостойкость, упругость.\n<strong>Ванадий (Ф) и Титан (Т)</strong> — для легирования конструкционных сталей.\n\nДля инструментальных — <strong>Вольфрам (В) и Молибден (М)</strong> — твёрдость." },
  { q: "Для чего используют лигатуры вольфрама и молибдена, для каких сталей", a: "Для инструментальных сталей — Вольфрам (В) и Молибден (М) придают инструменту дополнительную твёрдость.\n\nЛИГАТУРА — специально выплавленный материал или сплав для легирования жидкого металла." },
  { q: "Конвертерное производство стали. Определение, цели процесса", a: "<strong>Конвертерное производство</strong> – получение стали в конвертерах путём продувки кислородом шихты (жидкий чугун и металлолом).\n\n<strong>Цели:</strong>\n— снижение C с 4,0–4,5 % до 0,01–0,4 %;\n— окисление примесей (P, Si, Mn, S) с удалением в шлак." },
  { q: "Преимущества конвертерного способа производства стали", a: "1. Высокая производительность (30–50 минут на плавку).\n2. Низкая стоимость передела в сравнении с электросталеплавильным и мартеновским способами." },
  { q: "Состав шихты для конвертерной плавки стали, как происходит загрузка шихты", a: "Шихта: жидкий чугун + твёрдая металлическая часть.\n\n<strong>Химсостав чугуна:</strong> 4,0–4,5 % С; 0,1–0,5 % Mn; 0,5–0,9 % Si; ~0,02 % S; ~0,1 % P. Металлолом (до 30 %), известь, флюсы.\n\n<strong>Загрузка:</strong> сначала легковесный лом, затем тяжеловесный. После завалки — прогрев. Затем заливка жидкого чугуна." },
  { q: "Что такое конвертер, из каких частей состоит", a: "Конвертер — поворачивающийся на цапфах сосуд грушевидной формы, футерованный огнеупорами, снабжённый лёткой для выпуска стали и горловиной.\n\n<strong>Части:</strong> футеровка, лётка, горловина, кислородная фурма, механизм поворота.\n<strong>Ёмкость:</strong> 135–370 т." },
  { q: "Внепечная обработка сталей, цели процесса, где происходит?", a: "<strong>Цели:</strong>\n— перемешивание и усреднение;\n— корректировка химсостава;\n— доведение температуры;\n— дегазация (H₂, N₂);\n— чистота по неметаллическим включениям.\n\n<strong>Где:</strong> в ковше, в агрегате «ковш-печь», в вакууматоре." },
  { q: "Для производства каких сталей электродуговые печи, за счет чего происходит нагрев?", a: "В ДСП выплавляют: инструментальные, углеродистые, подшипниковые, коррозионностойкие, электротехнические, прецизионные сплавы, легированные, для ж/д колёс и рельсов.\n\n<strong>Нагрев</strong> — за счёт электрической дуги между электродами и шихтой." },
  { q: "Из каких частей состоит электродуговая сталеплавильная печь", a: "1. Электрододержатели.\n2. Электроды.\n3. Съёмный свод.\n4. Стальной кожух.\n5. Плавильное пространство.\n6. Дно (подина).\n7. Футеровка.\n8. Привод для наклона печи.\n9. Газоотвод.\n10. Рабочее окно.\n11. Стальной жёлоб.\n12. Газокислородные горелки, кислородные фурмы." },
  { q: "Что такое индукционные плавильные печи, из чего состоят?", a: "Индукционные печи — электрические; расплавление за счёт магнитного потока (вихревые токи).\n\n<strong>Состав:</strong> индуктор (электрическая часть) + тигель (внутри индуктора).\n\nЁмкость промышленных печей — до 50 т." },
  { q: "Состав шихты для выплавки стали в электродуговой печи", a: "— металлический лом (до 95 %);\n— чугун;\n— ферросплавы;\n— шлакообразующие (известь, плавиковый шпат, шамотный бой, кварцевый песок, боксит, железная руда, кокс);\n— металлизованные окатыши или ГБЖ." },
  { q: "Почему мартеновский процесс считается устаревшим?", a: "1. Длительный цикл плавки — 6–15 часов против 30–50 минут у конвертеров и ДСП.\n2. Нельзя получить высоколегированные и специальные стали.\n3. Опасные выбросы для экологии и здоровья.\n\nВ России в марте 2018 г. остановлена последняя крупная мартеновская печь (Выксунский металлургический комбинат)." },
  { q: "Что используют в качестве топлива в мартеновских печах", a: "Природный газ, мазут.\n\nНа современных печах применяют политопливные горелки с многоступенчатой подачей топлива и окислителя (от 5 % доли мазута до 100 %)." },
  { q: "Разновидности мартеновского процесса в зависимости от состава шихты", a: "<strong>Скрап-процесс</strong> — стальной лом + 25–45 % чушкового передельного чугуна. Применяют на заводах без доменных печей, но с большим количеством лома.\n\n<strong>Скрап-рудный процесс</strong> — жидкий чугун (55–75 %) + скрап + железная руда. Применяют на заводах с доменными печами." },
  { q: "Какую конструкцию имеют изложницы для разливки стали?", a: "Поперечное сечение — квадрат или окружность. Стенки могут иметь вогнутую, выпуклую или волнистую форму. Наклон стенок облегчает извлечение слитка. Ширина ~700 мм.\n\n<strong>Структура слитка:</strong> зона мелких равноосных кристаллов → зона столбчатых кристаллов → зона крупных равноосных кристаллов → усадочная раковина." },
  { q: "Опишите два способа заполнения изложниц при разливке стали, преимущества и недостатки", a: "<strong>Заливка сверху:</strong> невозможно избежать брызг, которые, застыв, окисляются и не расплавляются (плены).\n\n<strong>Сифонная заливка:</strong> заполняет изложницу снизу — малое попадание воздуха, отсутствие брызг. Но дороже (доп. оборудование, разъёмная конструкция изложниц). Потери стали в трубах сифона >1 %." },
  { q: "Что такое затравка, для чего нужна?", a: "Перед началом разливки в кристаллизатор МНЛЗ с нижней стороны вводится затравка — специальное устройство.\n\n<strong>Назначение:</strong> служит «затравкой» для начала кристаллизации стали и вытягивания слитка из кристаллизатора." },
  { q: "Какие типы конструкций МНЛЗ вы знаете?", a: "1. <strong>Вертикальные</strong> — значительная высота, минимальная вероятность обрыва слитка.\n2. <strong>Радиальные</strong> — большие площади, но не нужно поднимать металл на высоту.\n3. <strong>Вертикальные с изгибом слитка</strong> — слиток движется сверху вниз, потом изгибается и выходит горизонтально." },

  // Часть 3: Вопросы 41-56
  { q: "Что такое штейн? Как его получают в медном производстве?", a: "Штейн – промежуточный продукт в цветной металлургии, сплав сульфидов металлов.\n\nСуществует два базовых процесса плавки: плавка в жидкой ванне и плавка в газовой среде (взвешенная плавка)." },
  { q: "Какие вы знаете сплавы меди, их состав", a: "<strong>ЛАТУНИ</strong> — сплав меди с цинком, содержание цинка от 4 до 50 %.\n\n<strong>БРОНЗЫ</strong> — легированы элементами кроме цинка и никеля. Оловянные бронзы: 2,5–20 % олова. Алюминиевые бронзы: 5–12 % алюминия.\n\n<strong>МЕДНО-НИКЕЛЕВЫЕ СПЛАВЫ</strong> — главный легирующий элемент никель. Мельхиор 5–30 % Ni, Нейзильбер 5–35 % Ni и 13–45 % Zn." },
  { q: "Что является основным сырьём для производства меди, назовите содержание Cu", a: "Основным сырьём (свыше 85 %) для пирометаллургического процесса являются медные и коллективные сульфидные концентраты (содержание Cu — <strong>от 15 % до 45 %</strong>).\n\nСульфидные концентраты получают флотацией из руд с содержанием меди от 0,2 % до 3 %." },
  { q: "Пять этапов переработки сульфидных концентратов меди", a: "1. Обжиг.\n2. Плавка.\n3. Конвертирование.\n4. Рафинирование.\n5. Электролитическое рафинирование." },
  { q: "Как происходит электролитическое рафинирование меди?", a: "Процесс осуществляется в водном растворе серной кислоты и сульфата меди.\n\n<strong>Анод</strong> — листы черновой меди.\n<strong>Катод</strong> — пластинки (матрицы) из чистой меди.\n\nПри включении ванн в сеть постоянного тока происходит электрохимическое растворение меди из анода в электролит и осаждение её на катоде. Примеси распределяются между шламом и электролитом." },
  { q: "Назовите три способа добычи золота, кратко их охарактеризуйте", a: "<strong>Карьерный способ</strong> (открытый) — самый распространённый, при залегании руд недалеко от поверхности (до 500 м).\n\n<strong>Подземная или шахтная добыча</strong> — руды залегают на значительных глубинах (в ЮАР — более 4 км).\n\n<strong>Дражный способ</strong> — с помощью комплексного механизированного агрегата (мобильной обогатительной фабрики)." },
  { q: "Аффинаж, дайте определение", a: "Аффинаж – совокупность металлургических процессов получения благородных металлов высокой чистоты путём разделения их смеси и отдельных примесей.\n\nВключают пирометаллургические, гидрометаллургические процессы и электролиз." },
  { q: "Принципиальная схема аффинажа золота", a: "Au-содержащее сырьё → <strong>Вскрытие</strong> → Пульпа → <strong>Фильтрация</strong> → Раствор → <strong>Выделение золота</strong> → Au-металл → <strong>Переплав</strong> → Слитки, гранулы." },
  { q: "Как происходит «вскрытие» в процессе производства золота. Что такое «царская водка»", a: "Богатое по золоту сырьё (концентрат) подвергают вскрытию: растворение в царской водке либо гидрохлорирование.\n\nНа этой стадии происходит разделение золота и серебра: золотосодержащий раствор и серебросодержащий твёрдый осадок.\n\n<strong>Царская водка</strong> – смесь азотной и соляной кислот в соотношении 1 к 3." },
  { q: "Что такое сплав Доре, определение, состав", a: "Сплав Доре (техническое золото) – сплав золота и серебра, получаемый на золоторудных месторождениях и отправляемый на аффинажные заводы.\n\nСтандартный сплав Доре содержит не менее <strong>70 % золота и 25 % серебра</strong>." },
  { q: "Две технологические схемы производства никеля — из окисленных и сульфидных руд", a: "<strong>Окисленные руды:</strong> переработка заканчивается получением огневого никеля, отправляемого в чёрную металлургию без дополнительного рафинирования.\n\n<strong>Сульфидные медно-никелевые руды:</strong> требуют обязательного разделения меди и никеля и заканчиваются электролитическим рафинированием чернового металла. Позволяет получать никель марки Н-0 (≥ 99,99 %) и попутно извлекать ещё 14 ценных компонентов." },
  { q: "Основные этапы (4) технологии производства никеля из сульфидных медно-никелевых руд", a: "1. Флотация (селективная или коллективная).\n2. Штейновая плавка.\n3. Конвертирование штейна.\n4. Рафинирование." },
  { q: "Основной способ производства цинка, какой металл является побочным при производстве цинка", a: "Два способа: пирометаллургический и гидрометаллургический. <strong>95 % цинка в мире получают гидрометаллургическим способом.</strong>\n\nВ России применяется только гидрометаллургический способ: выщелачивание цинка из обожжённого концентрата раствором серной кислоты.\n\n<strong>Кадмий</strong> — побочный продукт производства цинка." },
  { q: "Свинец, свойства и использование", a: "<strong>Свинец</strong> — легкоплавкий металл синевато-серого цвета. Мягок, пластичен. Хороший поглотитель рентгеновского и гамма-излучения.\n\n<strong>Использование:</strong>\n— До 45 % — на электроды аккумуляторов.\n— До 20 % — на провода, кабели.\n— Футеровка труб и аппаратуры в химической промышленности.\n— Экраны для защиты от радиоактивного и рентгеновского излучений.\n\n<strong>Свинец ТОКСИЧЕН.</strong>" },
  { q: "Вольфрам и молибден, основные свойства, применение в промышленности", a: "<strong>Вольфрам</strong> – тугоплавкий тяжёлый металл светло-серого цвета. Тплавления – 3420 °C. Около 30 % идёт в легированные стали (быстрорежущие 8–20 % W). 50–60 % — на износостойкие, жаропрочные и твёрдые сплавы. Чистый — в электротехнике, радиоэлектронике, рентгенотехнике.\n\n<strong>Молибден</strong> – блестящий светло-серый тугоплавкий металл. Тплавления 2623 °C. Около 75 % используется для легирования сталей, остальное — компонент жаропрочных и антикоррозионных сплавов." },
  { q: "Что такое ферромолибден и как его получают", a: "Ферромолибден представляет собой сплав железа с молибденом, в виде которого металл вводят в сталь.\n\nИз методов получения применяется почти исключительно <strong>силикотермический метод</strong> — восстановление обожжённого молибденового концентрата кремнием." }
];

/* ============ ЛОГИКА ============ */
const validCards = cards.filter(c => c.q && c.a && c.a.trim() !== "");
let currentView = 'cards';
let filteredCards = [...validCards];
let searchFilter = '';

let mcOrder = [...mcQuestions.keys()];
let mcIndex = 0;
let mcAnswers = [];
let mcFinished = false;

const content = document.getElementById('content');
const stats = document.getElementById('stats');
const searchInput = document.getElementById('search');
document.getElementById('totalCount').textContent = validCards.length;
document.getElementById('mcTotal').textContent = mcQuestions.length;

document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    render();
  });
});

searchInput.addEventListener('input', () => {
  searchFilter = searchInput.value.trim().toLowerCase();
  if (currentView !== 'quiz') {
    filteredCards = searchFilter
      ? validCards.filter(c => (c.q + " " + c.a).toLowerCase().includes(searchFilter))
      : [...validCards];
  }
  render();
});

function flipAll(show) {
  document.querySelectorAll('.card').forEach(c => {
    if (show) c.classList.add('flipped');
    else c.classList.remove('flipped');
  });
}

function render() {
  if (currentView === 'cards') renderCards();
  else if (currentView === 'lecture') renderLecture();
  else if (currentView === 'cheatsheet') renderCheatsheet();
  else if (currentView === 'quiz') renderQuiz();

  const searchWrap = document.querySelector('.controls');
  if (currentView === 'quiz') {
    searchWrap.style.display = 'none';
    stats.textContent = '';
  } else {
    searchWrap.style.display = 'flex';
    const count = currentView === 'cards' ? filteredCards.length : validCards.length;
    stats.textContent = searchFilter
      ? `Найдено: ${count} из ${validCards.length}`
      : `Всего: ${validCards.length}`;
    document.querySelectorAll('#controls button').forEach(b => {
      b.style.display = currentView === 'cards' ? '' : 'none';
    });
  }
}

function renderCards() {
  if (filteredCards.length === 0) {
    content.innerHTML = '<div class="no-results">😕 Ничего не найдено.</div>';
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  filteredCards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <div class="card-num">Вопрос ${i + 1}</div>
          <h3>${card.q}</h3>
          <div class="hint">нажмите → ответ</div>
        </div>
        <div class="card-back">
          <div class="card-num">Ответ</div>
          <div class="answer">${card.a}</div>
          <div class="hint">← назад</div>
        </div>
      </div>`;
    el.addEventListener('click', () => el.classList.toggle('flipped'));
    grid.appendChild(el);
  });
  content.innerHTML = '';
  content.appendChild(grid);
}

function renderLecture() {
  let html = '<div class="lecture"><h2>📖 Конспект по ОМП (56 вопросов)</h2>';
  validCards.forEach((card, i) => {
    html += `<div class="lecture-item">
      <div class="lecture-q" data-num="${i + 1}">${card.q}</div>
      <div class="lecture-a">${card.a}</div>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

function renderCheatsheet() {
  let html = '<div class="cheatsheet"><h2>📋 Краткая шпаргалка (56 вопросов)</h2>';
  validCards.forEach((card, i) => {
    html += `<div class="cheat-item">
      <div class="cheat-q">${i + 1}. ${card.q}</div>
      <div class="cheat-a">${card.a}</div>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
  }

  if (mcFinished) { renderMcFinished(); return; }
  const total = mcOrder.length;
  const qIndex = mcOrder[mcIndex];
  const question = mcQuestions[qIndex];
  const userAnswer = mcAnswers[qIndex];
  const answered = userAnswer !== undefined && userAnswer !== -1;

  const correctCount = mcAnswers.reduce((acc, a, i) => acc + (a === mcQuestions[i].correct ? 1 : 0), 0);
  const answeredCount = mcAnswers.filter(a => a !== undefined && a !== -1).length;

  let scoreClass = 'mc-score';
  if (answeredCount > 0) {
    const pct = correctCount / answeredCount;
    if (pct >= 0.7) scoreClass += '';
    else if (pct >= 0.4) scoreClass += ' mid';
    else scoreClass += ' bad';
  }

  const letters = ['А', 'Б', 'В', 'Г', 'Д'];
  let optionsHtml = '';
  question.options.forEach((opt, i) => {
    let cls = 'mc-option';
    if (answered) {
      cls += ' disabled';
      if (i === question.correct) cls += ' correct';
      else if (i === userAnswer) cls += ' wrong';
    }
    optionsHtml += `<div class="${cls}" onclick="mcSelect(${i})">
      <div class="letter">${letters[i]}</div>
      <div>${opt}</div>
    </div>`;
  });

  let explanationHtml = '';
  if (answered) {
    const isCorrect = userAnswer === question.correct;
    explanationHtml = `<div class="mc-explanation">
      <span class="${isCorrect ? 'ok' : 'no'}">${isCorrect ? '✅ Верно!' : '❌ Неверно.'}</span>
      ${!isCorrect ? ` Правильный ответ: <strong>${question.options[question.correct]}</strong>.` : ''}
      <br><br>${question.explanation}
    </div>`;
  }

  const html = `
    <div class="mcquiz">
      <div class="mc-header">
        <span>Вопрос ${mcIndex + 1} из ${total}</span>
        <span class="${scoreClass}">✓ ${correctCount} / ${answeredCount}</span>
      </div>
      <div class="mc-progress-bar">
        <div class="mc-progress-fill" style="width: ${((mcIndex + 1) / total) * 100}%"></div>
      </div>
      <div class="mc-question">${question.q}</div>
      <div class="mc-options">${optionsHtml}</div>
      ${explanationHtml}
      <div class="mc-actions">
        <button class="btn-prev" onclick="mcPrev()" ${mcIndex === 0 ? 'disabled' : ''}>← Назад</button>
        ${answered
          ? (mcIndex === total - 1
              ? `<button class="btn-restart" onclick="mcFinish()">🏁 Завершить тест</button>`
              : `<button class="btn-next" onclick="mcNext()">Далее →</button>`)
          : `<button class="btn-next" disabled>Далее →</button>`}
      </div>
    </div>`;
  content.innerHTML = html;
}

function mcSelect(optionIdx) {
  const qIndex = mcOrder[mcIndex];
  if (mcAnswers[qIndex] !== undefined && mcAnswers[qIndex] !== -1) return;
  mcAnswers[qIndex] = optionIdx;
  renderQuiz();
}
function mcNext() { if (mcIndex < mcOrder.length - 1) { mcIndex++; renderQuiz(); } }
function mcPrev() { if (mcIndex > 0) { mcIndex--; renderQuiz(); } }
function mcFinish() { mcFinished = true; renderMcFinished(); }

function renderMcFinished() {
  const total = mcQuestions.length;
  const correct = mcAnswers.reduce((acc, a, i) => acc + (a === mcQuestions[i].correct ? 1 : 0), 0);
  const pct = Math.round((correct / total) * 100);
  let text, cls;
  if (pct >= 90) { text = '🏆 Отлично! Ты готов к зачёту!'; cls = 'good'; }
  else if (pct >= 75) { text = '👍 Хорошо! Немного повтори — и всё получится.'; cls = 'good'; }
  else if (pct >= 50) { text = '📚 Нормально, но стоит повторить сложные темы.'; cls = ''; }
  else { text = '⚠️ Нужно серьёзно подготовиться. Прочитай лекцию и шпаргалку.'; cls = 'bad'; }

  content.innerHTML = `
    <div class="mcquiz">
      <div class="mc-finished">
        <h2>🏁 Тест завершён</h2>
        <div class="mc-final-score">${correct} / ${total}</div>
        <div class="mc-final-text ${cls}">${text} (${pct}%)</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;">
          <button class="btn-restart" onclick="mcRestart(false)">🔄 Пройти снова</button>
          <button class="btn-restart" onclick="mcRestart(true)" style="background:#2a5298;color:#fff;">🔀 Случайный порядок</button>
        </div>
      </div>
    </div>`;
}

function mcRestart(shuffle) {
  mcIndex = 0;
  mcAnswers = [];
  mcFinished = false;
  if (shuffle) {
    for (let i = mcOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [mcOrder[i], mcOrder[j]] = [mcOrder[j], mcOrder[i]];
    }
  } else {
    mcOrder = [...mcQuestions.keys()];
}
  renderQuiz();
}

document.addEventListener('keydown', e => {
  if (currentView !== 'quiz') return;
  if (e.key === 'ArrowRight') mcNext();
  else if (e.key === 'ArrowLeft') mcPrev();
  else if (['1','2','3','4','5'].includes(e.key)) mcSelect(parseInt(e.key) - 1);
});

render();
</script>

</body>
</html>
