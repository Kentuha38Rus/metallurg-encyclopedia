<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ЦМ — Подготовка к зачёту</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom)) 14px;
    color: #222;
  }
  header { text-align: center; color: #fff; margin-bottom: 14px; }
  header h1 { font-size: 21px; margin-bottom: 5px; }
  header p { opacity: 0.85; font-size: 12px; }

  .view-switcher {
    margin: 0 auto 12px; display: flex; gap: 6px;
    overflow-x: auto; background: rgba(255,255,255,0.12);
    padding: 6px; border-radius: 12px; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; max-width: 1100px;
  }
  .view-switcher::-webkit-scrollbar { display: none; }
  .view-btn {
    padding: 10px 14px; border: 2px solid transparent; border-radius: 8px;
    background: rgba(255,255,255,0.15); color: #fff;
    font-size: 13px; font-weight: 600; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  .view-btn.active { background: #ffd93d; color: #1e3c72; border-color: #fff; }

  .controls {
    max-width: 1100px; margin: 0 auto 12px;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  }
  .controls input, .controls button {
    padding: 10px 14px; border: none; border-radius: 8px; font-size: 14px;
  }
  .controls input { flex: 1; min-width: 180px; background: #fff; }
  .controls button { background: #ffd93d; color: #222; font-weight: 600; cursor: pointer; }

  .stats { text-align: center; color: #fff; font-size: 12px; opacity: 0.85; margin-bottom: 12px; }
  .content { max-width: 1100px; margin: 0 auto; }

  .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
  .card { perspective: 1200px; height: 320px; cursor: pointer; }
  .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-front, .card-back {
    position: absolute; width: 100%; height: 100%;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 14px; padding: 16px 18px;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25); overflow-y: auto;
  }
  .card-front { background: #fff; border-left: 5px solid #2a5298; }
  .card-back { background: #fffbe6; border-left: 5px solid #ffd93d; transform: rotateY(180deg); }
  .card-num { font-size: 10px; font-weight: 700; color: #2a5298; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .card-back .card-num { color: #b8860b; }
  .card-front h3 { font-size: 15px; line-height: 1.35; color: #1e3c72; }
  .card-back .answer { font-size: 12.5px; line-height: 1.5; color: #333; white-space: pre-wrap; }
  .card-back .answer strong { color: #b8860b; }
  .hint { margin-top: auto; font-size: 10px; color: #888; text-align: right; font-style: italic; }

  .lecture { background: #fff; border-radius: 14px; padding: 20px 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .lecture h2 { color: #1e3c72; font-size: 18px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 3px solid #ffd93d; }
  .lecture-item { margin-bottom: 22px; padding-bottom: 16px; border-bottom: 1px dashed #ccc; }
  .lecture-item:last-child { border-bottom: none; }
  .lecture-q { font-size: 15px; font-weight: 700; color: #1e3c72; margin-bottom: 8px; line-height: 1.4; }
  .lecture-q::before { content: attr(data-num) ". "; color: #b8860b; font-weight: 900; }
  .lecture-a { font-size: 13.5px; line-height: 1.6; color: #333; white-space: pre-wrap; padding-left: 14px; border-left: 3px solid #ffd93d; }
  .lecture-a strong { color: #b8860b; }

  .cheatsheet { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .cheatsheet h2 { color: #1e3c72; font-size: 18px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 3px solid #ffd93d; }
  .cheat-item { margin-bottom: 8px; padding: 10px 12px; border-radius: 8px; background: #f8f9fb; border-left: 4px solid #2a5298; }
  .cheat-q { font-weight: 700; color: #1e3c72; font-size: 13px; margin-bottom: 4px; }
  .cheat-a { font-size: 12px; line-height: 1.5; color: #444; white-space: pre-wrap; }
  .cheat-a strong { color: #b8860b; }

  .mcquiz { background: #fff; border-radius: 14px; padding: 22px 18px; box-shadow: 0 8px 20px rgba(0,0,0,0.25); min-height: 400px; display: flex; flex-direction: column; }
  .mc-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; color: #666; }
  .mc-score { background: #e8f5e9; color: #2e7d32; padding: 4px 10px; border-radius: 12px; font-weight: 700; }
  .mc-score.bad { background: #ffebee; color: #c62828; }
  .mc-score.mid { background: #fff3e0; color: #ef6c00; }
  .mc-progress-bar { height: 6px; background: #eee; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .mc-progress-fill { height: 100%; background: linear-gradient(90deg, #2a5298, #ffd93d); transition: width 0.3s; }
  .mc-question { font-size: 16.5px; font-weight: 700; color: #1e3c72; line-height: 1.4; margin-bottom: 16px; }
  .mc-options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 16px; }
  .mc-option { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #f5f7fa; border: 2px solid transparent; cursor: pointer; transition: 0.15s; font-size: 14px; line-height: 1.4; color: #333; text-align: left; }
  .mc-option:not(.disabled):active { transform: scale(0.99); background: #eef1f6; }
  .mc-option .letter { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: #2a5298; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .mc-option.correct { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; }
  .mc-option.correct .letter { background: #4caf50; }
  .mc-option.wrong { background: #ffebee; border-color: #e53935; color: #b71c1c; }
  .mc-option.wrong .letter { background: #e53935; }
  .mc-option.disabled { cursor: default; }
  .mc-explanation { font-size: 13px; line-height: 1.55; color: #333; white-space: pre-wrap; padding: 12px 14px; background: #fffbe6; border-left: 4px solid #ffd93d; border-radius: 8px; margin-bottom: 14px; }
  .mc-explanation strong { color: #b8860b; }
  .mc-explanation .ok { color: #2e7d32; font-weight: 700; }
  .mc-explanation .no { color: #c62828; font-weight: 700; }
  .mc-actions { display: flex; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  .mc-actions button { padding: 12px 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; min-width: 100px; }
  .btn-next { background: #2a5298; color: #fff; }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-prev { background: #eee; color: #333; }
  .btn-prev:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-restart { background: #ffd93d; color: #1e3c72; }
  .mc-finished { text-align: center; padding: 30px 20px; }
  .mc-finished h2 { color: #1e3c72; font-size: 22px; margin-bottom: 14px; }
  .mc-final-score { font-size: 48px; font-weight: 900; background: linear-gradient(135deg, #2a5298, #ffd93d); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
  .mc-final-text { font-size: 15px; color: #555; margin-bottom: 20px; }
  .mc-final-text.good { color: #2e7d32; font-weight: 700; }
  .mc-final-text.bad { color: #c62828; font-weight: 700; }
  .no-results { text-align: center; color: #fff; padding: 40px; font-size: 15px; opacity: 0.7; }

  @media (max-width: 600px) {
    .card { height: 340px; }
    header h1 { font-size: 19px; }
    .view-btn { padding: 9px 12px; font-size: 12px; }
    .lecture, .mcquiz { padding: 16px; }
    .mc-question { font-size: 15px; }
    .mc-option { font-size: 13.5px; padding: 11px 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>⚗️ Металлургия цветных металлов</h1>
  <p>Карточек: <span id="totalCount">0</span> · Тестовых вопросов: <span id="mcTotal">0</span></p>
</header>

<div class="view-switcher">
  <button class="view-btn active" data-view="cards">🃏 Карточки</button>
  <button class="view-btn" data-view="lecture">📖 Лекция</button>
  <button class="view-btn" data-view="cheatsheet">📋 Шпаргалка</button>
  <button class="view-btn" data-view="quiz">🎯 Тест</button>
</div>

<div class="controls" id="controls">
  <input type="text" id="search" placeholder="🔍 Поиск...">
  <button onclick="flipAll(true)">Показать все</button>
  <button onclick="flipAll(false)">Скрыть все</button>
</div>

<div class="stats" id="stats"></div>

<div class="content" id="content"></div>

<script>
/* ============================================================
   49 КАРТОЧЕК — СТРОГО ПО ВОПРОСАМ ИЗ КОНЦА ГЛАВ PDF-ЛЕКЦИИ
   ============================================================ */
const cards = [
  // Алюминий (1-7)
  { q: "Укажите физико-химические свойства алюминия.", a: "Алюминий – легкий металл (плотность 2,7 г/см3) серебристого цвета. Имеет высокую тепло- и электропроводность. Электропроводность чистого алюминия составляет 65,5 % от электропроводности меди. Химически активен, но покрывается прочной оксидной пленкой." },
  { q: "Какое сырьё используется для производства алюминия?", a: "Главный вид рудного сырья – бокситы (содержат гидраргиллит, бемит или диаспор). Также используются нефелины, алуниты и глины (каолинит)." },
  { q: "Какие способы применяются для производства глинозёма?", a: "Основные способы: способ Байера (для бокситов с низким содержанием кремнезема) и метод спекания (для высококремнистых бокситов и нефелинов)." },
  { q: "В чём сущность метода Байера?", a: "Основан на обратимости реакции между гидратированной окисью алюминия и щелочью: при нагревании боксита с концентрированной щелочью окись алюминия переходит в раствор в виде алюмината натрия. Последующее разбавление и охлаждение растворов вызывает гидролиз с выделением в осадок гидроокиси алюминия." },
  { q: "В чём сущность производства глинозёма методом спекания?", a: "Боксит или нефелин спекают с содой и известняком при 1200-1300 °C. Образующийся спек (алюминат натрия) выщелачивают. Из раствора выделяют гидроокись алюминия, а из нерастворимого шлама извлекают соду." },
  { q: "Технологические особенности производства алюминия электролизом.", a: "Электролиз ведут в расплаве криолита Na3AlF6 с добавлением глинозема (Al2O3) при температуре 900-1000 °C. Катодом служит угольная подина, анодом — угольные блоки. Жидкий алюминий собирается на подине." },
  { q: "Какие сплавы на основе алюминия получаются электродуговой плавкой?", a: "Силикоалюминий (сплав алюминия с кремнием) получают восстановлением кремнеземистых руд углем в дуговых электропечах при температуре около 2500 °C." },
  
  // Магний (8-12)
  { q: "Укажите физико-химические свойства магния.", a: "Магний плавится при 651 °C, кипит при 1107 °C. Плотность 1,74 г/см3 (один из самых легких конструкционных металлов). Химически активен, при нагреве выше 623 °C на воздухе воспламеняется и горит." },
  { q: "Какое сырьё используется для производства магния?", a: "Ископаемые соединения: карналлит KCl·MgCl2·6H2O, магнезит MgCO3 и доломит MgCO3·CaCO3. Также используют морскую воду." },
  { q: "В чём сущность производства магния электролизом?", a: "Электролиз расплавленного хлорида магния MgCl2 (или смеси MgCl2 и KCl) в ванне с графитовым анодом и стальными катодами. Магний выделяется на катоде в жидком виде и всплывает на поверхность." },
  { q: "В чём сущность термического способа производства магния?", a: "Углетермический способ: окись магния смешивают с коксом, брикетируют и нагревают в электропечи при 2500 °C. Магний получается в виде паров, которые быстро охлаждают и конденсируют." },
  { q: "В чём сущность силикотермического способа производства магния?", a: "Окись магния (в составе каустического доломита) восстанавливают в вакууме ферросилицием (сплавом железа и кремния) при 1160-1170 °C. Пары магния конденсируются в кристаллический осадок." },
  
  // Бериллий (13-19)
  { q: "Укажите физико-химические свойства бериллия.", a: "Металл серого цвета, плавится при 1287 °C. Плотность 0,848 г/см3 (очень легкий). Химически активен, но устойчив на воздухе благодаря оксидной пленке." },
  { q: "Как классифицируются сплавы на основе бериллия?", a: "Большой интерес представляют сплавы бериллия с 20–40% алюминия (Be-Al). Они отличаются высокими механическими свойствами при плотности немногим больше бериллия." },
  { q: "Какие существуют способы производства бериллия?", a: "Металлотермические методы (восстановление фторида бериллия магнием) и электролитическое производство (электролиз расплавов солей)." },
  { q: "Какое сырьё применяется для производства бериллия?", a: "Минералы берилл Be3Al2[Si6O18], бертрандит Ве4[Si2O7](OH)2, фенакит Ве2[SiO4]. Содержание ВеО в рудах 0,02–0,6%." },
  { q: "В чём сущность металлотермических методов производства бериллия?", a: "Восстановление фторида бериллия металлами (например, магнием). Реакция идет с выделением большого количества тепла, шлак (MgF2) отделяется, а бериллий всплывает на поверхность ванны." },
  { q: "На чём основано магнийтермическое восстановление фторида бериллия?", a: "На реакции BeF2 + Mg = Be + MgF2. Процесс ведут в графитовых тиглях в индукционных печах при температуре около 900 °C с использованием флюсов." },
  { q: "Как осуществляется электролитическое производство бериллия?", a: "Электролиз расплавов галогенидов бериллия (например, BeCl2 и NaCl) в специальных ваннах. Анод изготавливают из плотного графита, катодом служит сам тигель." },
  
  // Титан (20-25)
  { q: "Укажите физико-химические свойства титана.", a: "Титан плавится при 1668 °C. Плотность 4,5 г/см3. Имеет две аллотропические модификации (α и β). Обладает высокой коррозионной стойкостью, низкой теплопроводностью." },
  { q: "Какое сырьё применяется для получения титана?", a: "Основные минералы: рутил TiO2 и ильменит FeTiO3. Ильменитовые руды обогащают с получением титанового шлака (80–87% TiO2)." },
  { q: "Каковы особенности производства тетрахлорида титана?", a: "Тетрахлорид титана TiCl4 получают хлорированием титанового шлака газообразным хлором в присутствии угля при 700–900 °C. Затем его очищают ректификацией от примесей." },
  { q: "В чём сущность магниетермического способа производства титана?", a: "Восстановление тетрахлорида титана TiCl4 магнием в стальных герметичных аппаратах в атмосфере аргона при 850...900 °C. В результате получают губчатый титан и хлористый магний." },
  { q: "В чём сущность натриетермического способа производства титана?", a: "Восстановление TiCl4 жидким натрием в атмосфере аргона при 801...883 °C. В результате получают титановый порошок и хлористый натрий, который отделяют выщелачиванием." },
  { q: "В чём сущность кальциетермического способа производства титана?", a: "Восстановление диоксида титана TiO2 кальцием при 1000...1100 °C. В результате получают мелкодисперсный порошок титана и оксид кальция." },
  
  // Медь (26-30)
  { q: "Укажите физико-химические свойства меди.", a: "Медь плавится при 1083 °C. Плотность 8,94 г/см3. Обладает высокой электро- и теплопроводностью (уступает только серебру). Химическая активность невелика." },
  { q: "Укажите способы производства меди.", a: "Пирометаллургический способ (основной, около 85% меди) и гидрометаллургический способ (для бедных и окисленных руд)." },
  { q: "Как проводится выплавка меди из сульфидных концентратов и руд?", a: "Сульфидные концентраты плавят на штейн (сплав сульфидов Cu2S и FeS). Штейн продувают в конвертере для получения черновой меди, которую затем рафинируют." },
  { q: "Как проводят обогащение медных руд?", a: "Сульфидные руды обогащают флотацией, получая концентраты с содержанием до 55% Cu. Извлечение меди в концентраты составляет 80—95%." },
  { q: "Что представляет собой флотация?", a: "Процесс обогащения, основанный на различной смачиваемости поверхности минералов. Медные минералы (сульфиды) не смачиваются водой и прилипают к пузырькам воздуха, всплывая в пену." },
  
  // Никель (31-37)
  { q: "Укажите физико-химические свойства никеля.", a: "Никель плавится при 1455 °C. Плотность 8,897 г/см3. Ферромагнитный металл. Обладает высокой коррозионной стойкостью и жаростойкостью." },
  { q: "Какое сырьё применяют для получения никеля?", a: "Окисленные никелевые руды (силикаты) и сульфидные медно-никелевые руды (пентландит, халькопирит)." },

/* ============ ЛОГИКА (Скопирована из omp.html) ============ */
const validCards = cards.filter(c => c.q && c.a && c.a.trim() !== "");
let currentView = 'cards';
let filteredCards = [...validCards];
let searchFilter = '';

let mcOrder = [...mcQuestions.keys()];
let mcIndex = 0;
let mcAnswers = [];
let mcFinished = false;

const content = document.getElementById('content');
const stats = document.getElementById('stats');
const searchInput = document.getElementById('search');
document.getElementById('totalCount').textContent = validCards.length;
document.getElementById('mcTotal').textContent = mcQuestions.length;

document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    render();
  });
});

searchInput.addEventListener('input', () => {
  searchFilter = searchInput.value.trim().toLowerCase();
  if (currentView !== 'quiz') {
    filteredCards = searchFilter
      ? validCards.filter(c => (c.q + " " + c.a).toLowerCase().includes(searchFilter))
      : [...validCards];
  }
  render();
});

function flipAll(show) {
  document.querySelectorAll('.card').forEach(c => {
    if (show) c.classList.add('flipped');
    else c.classList.remove('flipped');
  });
}

function render() {
  if (currentView === 'cards') renderCards();
  else if (currentView === 'lecture') renderLecture();
  else if (currentView === 'cheatsheet') renderCheatsheet();
  else if (currentView === 'quiz') renderQuiz();

  const searchWrap = document.querySelector('.controls');
  if (currentView === 'quiz') {
    searchWrap.style.display = 'none';
    stats.textContent = '';
  } else {
    searchWrap.style.display = 'flex';
    const count = currentView === 'cards' ? filteredCards.length : validCards.length;
    stats.textContent = searchFilter
      ? `Найдено: ${count} из ${validCards.length}`
      : `Всего: ${validCards.length}`;
    document.querySelectorAll('#controls button').forEach(b => {
      b.style.display = currentView === 'cards' ? '' : 'none';
    });
  }
}

function renderCards() {
  if (filteredCards.length === 0) {
    content.innerHTML = '<div class="no-results">😕 Ничего не найдено.</div>';
    return;
  }
  const grid = document.createElement('div');
  grid.className = 'grid';
  filteredCards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <div class="card-num">Вопрос ${i + 1}</div>
          <h3>${card.q}</h3>
          <div class="hint">нажмите → ответ</div>
        </div>
        <div class="card-back">
          <div class="card-num">Ответ</div>
          <div class="answer">${card.a}</div>
          <div class="hint">← назад</div>
        </div>
      </div>`;
    el.addEventListener('click', () => el.classList.toggle('flipped'));
    grid.appendChild(el);
  });
  content.innerHTML = '';
  content.appendChild(grid);
}

function renderLecture() {
  let html = '<div class="lecture"><h2>📖 Конспект по ЦМ (49 вопросов)</h2>';
  validCards.forEach((card, i) => {
    html += `<div class="lecture-item">
      <div class="lecture-q" data-num="${i + 1}">${card.q}</div>
      <div class="lecture-a">${card.a}</div>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

function renderCheatsheet() {
  let html = '<div class="cheatsheet"><h2>📋 Краткая шпаргалка (49 вопросов)</h2>';
  validCards.forEach((card, i) => {
    html += `<div class="cheat-item">
      <div class="cheat-q">${i + 1}. ${card.q}</div>
      <div class="cheat-a">${card.a}</div>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

function renderQuiz() {
  if (mcFinished) { renderMcFinished(); return; }
  const total = mcOrder.length;
  const qIndex = mcOrder[mcIndex];
  const question = mcQuestions[qIndex];
  const userAnswer = mcAnswers[qIndex];
  const answered = userAnswer !== undefined && userAnswer !== -1;

  const correctCount = mcAnswers.reduce((acc, a, i) => acc + (a === mcQuestions[i].correct ? 1 : 0), 0);
  const answeredCount = mcAnswers.filter(a => a !== undefined && a !== -1).length;

  let scoreClass = 'mc-score';
  if (answeredCount > 0) {
    const pct = correctCount / answeredCount;
    if (pct >= 0.7) scoreClass += '';
    else if (pct >= 0.4) scoreClass += ' mid';
    else scoreClass += ' bad';
  }

  const letters = ['А', 'Б', 'В', 'Г', 'Д'];
  let optionsHtml = '';
  question.options.forEach((opt, i) => {
    let cls = 'mc-option';
    if (answered) {
      cls += ' disabled';
      if (i === question.correct) cls += ' correct';
      else if (i === userAnswer) cls += ' wrong';
    }
    optionsHtml += `<div class="${cls}" onclick="mcSelect(${i})">
      <div class="letter">${letters[i]}</div>
      <div>${opt}</div>
    </div>`;
  });

  let explanationHtml = '';
  if (answered) {
    const isCorrect = userAnswer === question.correct;
    explanationHtml = `<div class="mc-explanation">
      <span class="${isCorrect ? 'ok' : 'no'}">${isCorrect ? '✅ Верно!' : '❌ Неверно.'}</span>
      ${!isCorrect ? ` Правильный ответ: <strong>${question.options[question.correct]}</strong>.` : ''}
      <br><br>${question.explanation}
    </div>`;
  }

  const html = `
    <div class="mcquiz">
      <div class="mc-header">
        <span>Вопрос ${mcIndex + 1} из ${total}</span>
        <span class="${scoreClass}">✓ ${correctCount} / ${answeredCount}</span>
      </div>
      <div class="mc-progress-bar">
        <div class="mc-progress-fill" style="width: ${((mcIndex + 1) / total) * 100}%"></div>
      </div>
      <div class="mc-question">${question.q}</div>
      <div class="mc-options">${optionsHtml}</div>
      ${explanationHtml}
      <div class="mc-actions">
        <button class="btn-prev" onclick="mcPrev()" ${mcIndex === 0 ? 'disabled' : ''}>← Назад</button>
        ${answered
          ? (mcIndex === total - 1
              ? `<button class="btn-restart" onclick="mcFinish()">🏁 Завершить тест</button>`
              : `<button class="btn-next" onclick="mcNext()">Далее →</button>`)
          : `<button class="btn-next" disabled>Далее →</button>`}
      </div>
    </div>`;
  content.innerHTML = html;
}

function mcSelect(optionIdx) {
  const qIndex = mcOrder[mcIndex];
  if (mcAnswers[qIndex] !== undefined && mcAnswers[qIndex] !== -1) return;
  mcAnswers[qIndex] = optionIdx;
  renderQuiz();
}
function mcNext() { if (mcIndex < mcOrder.length - 1) { mcIndex++; renderQuiz(); } }
function mcPrev() { if (mcIndex > 0) { mcIndex--; renderQuiz(); } }
function mcFinish() { mcFinished = true; renderMcFinished(); }

function renderMcFinished() {
  const total = mcQuestions.length;
  const correct = mcAnswers.reduce((acc, a, i) => acc + (a === mcQuestions[i].correct ? 1 : 0), 0);
  const pct = Math.round((correct / total) * 100);
  let text, cls;
  if (pct >= 90) { text = '🏆 Отлично! Ты готов к зачёту!'; cls = 'good'; }
  else if (pct >= 75) { text = '👍 Хорошо! Немного повтори — и всё получится.'; cls = 'good'; }
  else if (pct >= 50) { text = '📚 Нормально, но стоит повторить сложные темы.'; cls = ''; }
  else { text = '⚠️ Нужно серьёзно подготовиться. Прочитай лекцию и шпаргалку.'; cls = 'bad'; }

  content.innerHTML = `
    <div class="mcquiz">
      <div class="mc-finished">
        <h2>🏁 Тест завершён</h2>
        <div class="mc-final-score">${correct} / ${total}</div>
        <div class="mc-final-text ${cls}">${text} (${pct}%)</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;">
          <button class="btn-restart" onclick="mcRestart(false)">🔄 Пройти снова</button>
          <button class="btn-restart" onclick="mcRestart(true)" style="background:#2a5298;color:#fff;">🔀 Случайный порядок</button>
        </div>
      </div>
    </div>`;
}

function mcRestart(shuffle) {
  mcIndex = 0;
  mcAnswers = [];
  mcFinished = false;
  if (shuffle) {
    for (let i = mcOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [mcOrder[i], mcOrder[j]] = [mcOrder[j], mcOrder[i]];
    }
  } else {
    mcOrder = [...mcQuestions.keys()];
  }
  renderQuiz();
}

document.addEventListener('keydown', e => {
  if (currentView !== 'quiz') return;
  if (e.key === 'ArrowRight') mcNext();
  else if (e.key === 'ArrowLeft') mcPrev();
  else if (['1','2','3','4','5'].includes(e.key)) mcSelect(parseInt(e.key) - 1);
});

render();
</script>
