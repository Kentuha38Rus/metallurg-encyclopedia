<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>3D Модель детали</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { 
            width: 100%; 
            height: 100%; 
            /* Светлый градиент для фона */
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%); 
            font-family: -apple-system, sans-serif;
            overflow: hidden; 
        }

        .main-container {
            display: flex;
            width: 100vw;
            height: 100dvh; 
        }

        .viewer-panel {
            flex: 1.5; 
            position: relative;
        }

        .image-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* Светлая панель для чертежа */
            background: #f8fafc; 
            border-left: 2px solid #e2e8f0;
            overflow: hidden; 
        }

        .image-panel img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            border: 4px solid #ffffff; 
            background: #fff;
        }

        #info {
            position: absolute; top: 15px; width: 100%; text-align: center;
            /* Темный текст для светлого фона */
            color: #64748b; 
            font-size: 12px; 
            font-weight: 600;
            pointer-events: none;
            z-index: 10;
        }

        canvas { display: block; }

        @media (max-width: 800px) {
            .main-container { flex-direction: column; }
            .viewer-panel { flex: 1.2; }
            .image-panel { 
                flex: 1; 
                border-left: none; 
                border-top: 2px solid #e2e8f0; 
                padding: 10px; 
            }
            .image-panel img { 
                border: 2px solid #ffffff; 
                border-radius: 6px; 
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="viewer-panel" id="viewer-panel">
            <div id="info">🖱️ Вращение · Масштаб</div>
        </div>

        <div class="image-panel">
            <img src="photo1.jpg" alt="Фотография детали">
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const viewerContainer = document.getElementById('viewer-panel');
        const width = viewerContainer.clientWidth;
        const height = viewerContainer.clientHeight;

        const scene = new THREE.Scene();
        scene.background = null; // Прозрачный фон, чтобы был виден CSS-градиент

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0; 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        viewerContainer.appendChild(renderer.domElement);

        // Встроенная студия света
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();
        const environment = new RoomEnvironment();
        scene.environment = pmremGenerator.fromScene(environment).texture;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0); // Немного усилили базовый свет для светлого фона
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5); // Свет снова нейтрально-белый
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        scene.add(directionalLight);

        // Невидимый пол для тени
        const planeGeometry = new THREE.PlaneGeometry(20, 20);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.15 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -2.5; 
        plane.receiveShadow = true;
        scene.add(plane);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false; 

        const loader = new GLTFLoader();
        loader.load(
            'model.glb', 
            function (gltf) {
                const model = gltf.scene;
                
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        
                        if (child.material) {
                            // ВОЗВРАЩАЕМ СТАЛЬНОЙ ЦВЕТ
                            if (child.material.color) {
                                child.material.color.setHex(0xffffff); // Белый цвет позволяет текстуре стали проявиться
                            }
                            child.material.envMapIntensity = 1.5; // Чуть усилили отражения для металла
                        }
                    }
                });

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 4.5 / maxDim; 
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale));

                scene.add(model);
                
                camera.position.set(4, 4, 6);
                controls.target.set(0, 0, 0);
                controls.update();
            },
            undefined,
            function (error) {
                console.error('Ошибка загрузки модели:', error);
            }
        );

        window.addEventListener('resize', () => {
            const newWidth = viewerContainer.clientWidth;
            const newHeight = viewerContainer.clientHeight;
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
