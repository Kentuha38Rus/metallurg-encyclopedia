<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>3D Модель детали</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #0f172a; /* Темный фон для контраста */
            font-family: -apple-system, sans-serif;
            overflow: hidden; 
        }

        .main-container {
            display: flex;
            width: 100vw;
            height: 100dvh; 
        }

        .viewer-panel {
            flex: 1.5; 
            position: relative;
        }

        .image-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4); 
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden; 
        }

        .image-panel img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            border: 4px solid rgba(255, 255, 255, 0.8); 
            background: #fff;
        }

        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.5); font-size: 11px; pointer-events: none;
            z-index: 10;
        }

        canvas { display: block; }

        @media (max-width: 800px) {
            .main-container { flex-direction: column; }
            .viewer-panel { flex: 1.2; }
            .image-panel { 
                flex: 1; 
                border-left: none; 
                border-top: 1px solid rgba(255, 255, 255, 0.1); 
                padding: 10px; 
            }
            .image-panel img { border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 6px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="viewer-panel" id="viewer-panel">
            <div id="info">🖱️ Вращение · Масштаб</div>
        </div>

        <div class="image-panel">
            <img src="photo1.jpg" alt="Фотография детали">
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        const viewerContainer = document.getElementById('viewer-panel');
        const width = viewerContainer.clientWidth;
        const height = viewerContainer.clientHeight;

        const scene = new THREE.Scene();
        scene.background = null; 

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        // Максимально качественный рендеринг
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2; 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        viewerContainer.appendChild(renderer.domElement);

        // --- ЗАГРУЗКА СТУДИЙНОГО HDRI (ВЫСОКОЕ КАЧЕСТВО) ---
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new RGBELoader()
            .setDataType(THREE.HalfFloatType)
            .load('https://threejs.org/examples/textures/equirectangular/studio_small_03_1k.hdr', function (texture) {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.environment = envMap;
                texture.dispose();
                pmremGenerator.dispose();
            });

        // --- ГЕНЕРАЦИЯ ПРОЦЕДУРНОГО ШУМА (Микроцарапины для реализма) ---
        const canvas = document.createElement('canvas');
        canvas.width = 512; 
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        // Базовый серый цвет
        ctx.fillStyle = '#888888'; 
        ctx.fillRect(0, 0, 512, 512);
        // Рисуем тысячи хаотичных штрихов (шлифовка металла)
        for (let i = 0; i < 5000; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.15})`;
            const x = Math.random() * 512;
            const y = Math.random() * 512;
            // Горизонтальные штрихи
            ctx.fillRect(x, y, Math.random() * 15, 1); 
        }
        const noiseTexture = new THREE.CanvasTexture(canvas);
        noiseTexture.wrapS = THREE.RepeatWrapping;
        noiseTexture.wrapT = THREE.RepeatWrapping;

        // Освещение и тени
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        const backLight = new THREE.DirectionalLight(0xaaccff, 1.5);
        backLight.position.set(-5, 0, -5);
        scene.add(backLight);

        // Невидимый пол для тени
        const planeGeometry = new THREE.PlaneGeometry(20, 20);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.15 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -2.5; 
        plane.receiveShadow = true;
        scene.add(plane);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false; 
        // Свободное вращение 360 градусов!

        const loader = new GLTFLoader();
        loader.load(
            'model.glb', 
            function (gltf) {
                const model = gltf.scene;
                
                model.traverse((child) => {
                    if (child.isMesh) {
                        // --- СОЗДАЕМ РЕАЛИСТИЧНЫЙ PBR-МАТЕРИАЛ ---
                        const material = new THREE.MeshPhysicalMaterial({
                            color: 0xcccccc,      // Светлый металл
                            metalness: 1.0,       // Чистый металл
                            roughness: 0.35,      // Базовое значение (будет перекрыто картой)
                            roughnessMap: noiseTexture, // Наш процедурный шум
                            clearcoat: 1.0,       // Эффект защитного лака/полировки
                            clearcoatRoughness: 0.1,
                            envMapIntensity: 1.5  // Яркость отражений
                        });

                        // --- ТРИПЛАНАРНОЕ ПРОЕЦИРОВАНИЕ (Наложение текстуры без UV) ---
                        material.onBeforeCompile = (shader) => {
                            shader.uniforms.uRoughnessMap = { value: noiseTexture };
                            
                            // Внедряем код в шейдер
                            shader.fragmentShader = shader.fragmentShader.replace(
                                '#include <roughnessmap_fragment>',
                                `
                                // Трипланарное наложение (по осям X, Y, Z)
                                vec3 blend = pow(abs(vNormal), vec3(4.0));
                                blend /= dot(blend, vec3(1.0));

                                vec4 xTex = texture2D(uRoughnessMap, vViewPosition.yz * 0.5);
                                vec4 yTex = texture2D(uRoughnessMap, vViewPosition.xz * 0.5);
                                vec4 zTex = texture2D(uRoughnessMap, vViewPosition.xy * 0.5);
                                
                                vec4 texColor = xTex * blend.x + yTex * blend.y + zTex * blend.z;

                                float roughnessFactor = roughness * texColor.r;
                                `
                            );
                        };

                        child.material = material;
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                // Центрирование и масштабирование
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 4.5 / maxDim; 
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale));

                scene.add(model);
                
                camera.position.set(4, 4, 6);
                controls.target.set(0, 0, 0);
                controls.update();
            },
            undefined,
            function (error) {
                console.error('Ошибка загрузки модели:', error);
            }
        );

        window.addEventListener('resize', () => {
            const newWidth = viewerContainer.clientWidth;
            const newHeight = viewerContainer.clientHeight;
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
