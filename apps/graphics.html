<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель детали</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e3c72; font-family: -apple-system, sans-serif; }
        
        #info {
            position: absolute; top: 15px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.7); font-size: 12px; pointer-events: none;
            z-index: 10;
        }

        /* Панель управления видами */
        #view-controls {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            z-index: 10; width: 90%; max-width: 600px;
            background: rgba(255,255,255,0.1); padding: 8px; border-radius: 12px;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        #view-controls button {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 8px 14px; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: 600;
            transition: 0.2s;
            flex: 1; min-width: 80px;
        }

        #view-controls button:hover { background: rgba(255, 255, 255, 0.3); }
        #view-controls button:active { transform: scale(0.95); background: #ffd93d; color: #1e3c72; }
        
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">🖱️ ЛКМ — вращение · Колесо — масштаб · ПКМ — перемещение</div>
    
    <!-- Кнопки видов -->
    <div id="view-controls">
        <button onclick="setView('iso')">Изометрия</button>
        <button onclick="setView('top')">Сверху</button>
        <button onclick="setView('bottom')">Снизу</button>
        <button onclick="setView('front')">Спереди</button>
        <button onclick="setView('back')">Сзади</button>
        <button onclick="setView('left')">Слева</button>
        <button onclick="setView('right')">Справа</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e3c72);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // ОТКЛЮЧАЕМ АВТО-ВРАЩЕНИЕ
        controls.autoRotate = false; 

        // Дистанция камеры (насколько далеко она стоит от центра)
        const camDist = 6;

        // Функция для переключения видов (делаем глобальной, чтобы кнопки ее видели)
        window.setView = function(view) {
            switch(view) {
                case 'top':    camera.position.set(0, camDist, 0.01); break; // 0.01 чтобы избежать "залипания" камеры
                case 'bottom': camera.position.set(0, -camDist, 0.01); break;
                case 'front':  camera.position.set(0, 0, camDist); break;
                case 'back':   camera.position.set(0, 0, -camDist); break;
                case 'left':   camera.position.set(-camDist, 0, 0); break;
                case 'right':  camera.position.set(camDist, 0, 0); break;
                case 'iso':    camera.position.set(3.5, 3.5, 5); break; // Стандартный 3D вид
            }
            // Камера всегда смотрит в центр (0,0,0)
            controls.target.set(0, 0, 0);
            controls.update();
        };

        const loader = new GLTFLoader();
        loader.load(
            'model.glb', 
            function (gltf) {
                const model = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 5 / maxDim; 
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale));

                scene.add(model);
                
                // Стартовая позиция камеры
                setView('iso');
            },
            undefined,
            function (error) {
                console.error('Ошибка загрузки модели:', error);
                alert('Не удалось загрузить 3D модель. Проверьте путь к файлу.');
            }
        );

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
