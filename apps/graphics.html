<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Модель детали</title>
    <style>
        body { 
            margin: 0; 
            background-color: #1e3c72; 
            font-family: -apple-system, sans-serif;
            overflow: hidden; /* Убираем общую прокрутку */
        }

        /* Контейнер, который делит экран на две части */
        .main-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Левая часть - 3D */
        .viewer-panel {
            flex: 1.5; /* 3D-модель занимает чуть больше места */
            position: relative;
            background: #1e3c72;
        }

        /* Правая часть - Фото */
        .image-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: rgba(0, 0, 0, 0.2); /* Чуть темнее фон для контраста */
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Стили для самой фотографии (рамка) */
        .image-panel img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Картинка не обрезается, вписывается целиком */
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* Красивая тень */
            border: 4px solid rgba(255, 255, 255, 0.8); /* Белая рамка вокруг фото */
            background: #fff;
        }

        #info {
            position: absolute; top: 15px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.7); font-size: 12px; pointer-events: none;
            z-index: 10;
        }

        canvas { display: block; }

        /* Если экран узкий (телефон), располагаем элементы друг под другом */
        @media (max-width: 800px) {
            .main-container { flex-direction: column; }
            .viewer-panel { flex: 1; }
            .image-panel { flex: 1; border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 15px; }
            .image-panel img { border: 2px solid rgba(255, 255, 255, 0.8); }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Блок с 3D -->
        <div class="viewer-panel" id="viewer-panel">
            <div id="info">🖱️ ЛКМ — вращение · Колесо — масштаб</div>
        </div>

        <!-- Блок с фотографией -->
        <div class="image-panel">
            <!-- Вставьте сюда название вашего файла картинки -->
            <img src="photo1.jpg" alt="Фотография детали">
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Находим панель, где будет жить 3D, чтобы правильно задать размеры
        const viewerContainer = document.getElementById('viewer-panel');
        const width = viewerContainer.clientWidth;
        const height = viewerContainer.clientHeight;

        const scene = new THREE.Scene();
        // Делаем фон 3D прозрачным, чтобы он сливался с синим градиентом
        scene.background = null; 

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        viewerContainer.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false; 

        const loader = new GLTFLoader();
        loader.load(
            'model.glb', 
            function (gltf) {
                const model = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 5 / maxDim; 
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale));

                scene.add(model);
                
                camera.position.set(3, 3, 5);
                controls.target.set(0, 0, 0);
                controls.update();
            },
            undefined,
            function (error) {
                console.error('Ошибка загрузки модели:', error);
                alert('Не удалось загрузить 3D модель.');
            }
        );

        // Правильное изменение размера при повороте экрана
        window.addEventListener('resize', () => {
            const newWidth = viewerContainer.clientWidth;
            const newHeight = viewerContainer.clientHeight;
            
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
