<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>3D Модель детали</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { 
            width: 100%; height: 100%; background-color: #1e3c72; 
            font-family: -apple-system, sans-serif; overflow: hidden; 
        }
        .main-container { display: flex; width: 100vw; height: 100dvh; }
        .viewer-panel { flex: 1.5; position: relative; background: #1e3c72; }
        .image-panel { 
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 20px; background: rgba(0, 0, 0, 0.2); 
            border-left: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden;
        }
        .image-panel img { 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 4px solid rgba(255, 255, 255, 0.8); background: #fff;
        }
        #info { 
            position: absolute; top: 10px; width: 100%; text-align: center; 
            color: rgba(255, 255, 255, 0.7); font-size: 11px; pointer-events: none; z-index: 10; 
        }
        canvas { display: block; }
        @media (max-width: 800px) {
            .main-container { flex-direction: column; }
            .viewer-panel { flex: 1.2; }
            .image-panel { flex: 1; border-left: none; border-top: 1px solid rgba(255, 255, 255, 0.1); padding: 10px; }
            .image-panel img { border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 6px; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="viewer-panel" id="viewer-panel">
            <div id="info">🖱️ Вращение · Масштаб</div>
        </div>
        <div class="image-panel">
            <img src="photo1.jpg" alt="Фотография детали">
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        // Импортируем загрузчик окружения для создания реалистичного металла
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        const viewerContainer = document.getElementById('viewer-panel');
        const width = viewerContainer.clientWidth;
        const height = viewerContainer.clientHeight;

        const scene = new THREE.Scene();
        scene.background = null; 

        // --- НАСТРОЙКА ОКРУЖЕНИЯ ДЛЯ МЕТАЛЛА ---
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        // Создаем виртуальную комнату, которая будет отражаться в детали
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        // Включаем правильное отображение света и теней
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        viewerContainer.appendChild(renderer.domElement);

        // Добавляем немного прямого света для контраста
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false; 

        const loader = new GLTFLoader();
        loader.load(
            'model.glb', 
            function (gltf) {
                const model = gltf.scene;
                
                // --- НАЛОЖЕНИЕ ТЕКСТУРЫ МЕТАЛЛА ---
                model.traverse((child) => {
                    if (child.isMesh) {
                        // Заменяем старый материал на новый металлический
                        child.material = new THREE.MeshStandardMaterial({
                            color: 0xaaaaaa,      // Цвет: Серебристо-серый (как сталь)
                            metalness: 0.95,      // 1.0 = максимальный металл, 0.0 = пластик
                            roughness: 0.25,      // 0.0 = зеркало, 1.0 = шероховатый (0.25 = шлифованный металл)
                            envMapIntensity: 1.0  // Сила отражения окружения
                        });
                    }
                });

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 5 / maxDim; 
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale));

                scene.add(model);
                
                camera.position.set(3, 3, 5);
                controls.target.set(0, 0, 0);
                controls.update();
            },
            undefined,
            function (error) {
                console.error('Ошибка загрузки модели:', error);
                alert('Не удалось загрузить 3D модель.');
            }
        );

        window.addEventListener('resize', () => {
            const newWidth = viewerContainer.clientWidth;
            const newHeight = viewerContainer.clientHeight;
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, newHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
